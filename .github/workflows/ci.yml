name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests, lint and installer
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install declared npm
        shell: bash
        run: |
          manager="$(node -p "require('./package.json').packageManager")"
          [[ "$manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --global "$manager" --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "${manager#npm@}"
      - run: npm ci
      - run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile=test-results.xml
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node tools/electron-smoke.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: electron-smoke-screenshots
          path: package-output/smoke/
          if-no-files-found: warn
          retention-days: 14
      - name: Build Windows installer without publishing
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: windows-test-results
          path: |
            test-results.xml
            coverage/
          if-no-files-found: warn
          retention-days: 14
