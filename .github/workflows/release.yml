name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        shell: bash
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          node -e "require('./dist/build/versionTag').assertTagMatches(process.env.GIT_TAG, require('./package.json').version)"

      - name: Pre-create GitHub Release (draft)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          # Bewusst als Draft: Ein veroeffentlichtes, aber noch leeres Release laesst
          # jeden laufenden Client beim Update-Check in einen 404 auf latest.yml laufen,
          # solange der Installer-Build noch nichts hochgeladen hat. Drafts sind fuer
          # electron-updater unsichtbar; veroeffentlicht wird erst nach dem Upload.
          gh release view "$GIT_TAG" >/dev/null 2>&1 || gh release create "$GIT_TAG" --title "$GIT_TAG" --notes "" --draft

      - name: Build & publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          # Ohne latest.yml kann electron-updater das Update nicht aufloesen. Fehlt sie,
          # bleibt das Release Draft und der Job schlaegt fehl, statt ein kaputtes
          # Update zu veroeffentlichen.
          assets=$(gh release view "$GIT_TAG" --json assets --jq '[.assets[].name] | join(" ")')
          echo "Assets am Release: $assets"
          for required in latest.yml; do
            case " $assets " in
              *" $required "*) ;;
              *)
                echo "::error::$required fehlt am Release $GIT_TAG - Release bleibt Draft."
                exit 1
                ;;
            esac
          done
          gh release edit "$GIT_TAG" --draft=false

      - name: Collect builds (versioned + latest)
        shell: bash
        run: |
          mkdir -p upload
          # Versionierte Dateien (z.B. QuotaBar-1.0.3-portable.exe / -setup.exe / -win.zip)
          cp package-output/QuotaBar-*-portable.exe upload/
          cp package-output/QuotaBar-*-setup.exe upload/
          cp package-output/QuotaBar-*-win.zip upload/
          # Zusätzliche "latest"-Kopien mit festem Namen für stabile Links
          cp package-output/QuotaBar-*-portable.exe upload/QuotaBar-portable.exe
          cp package-output/QuotaBar-*-setup.exe upload/QuotaBar-Setup.exe
          cp package-output/QuotaBar-*-win.zip upload/QuotaBar.zip
          ls -la upload/

      - name: Upload builds as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: builds
          path: upload/
          retention-days: 1

  ftp:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v5
        with:
          name: builds
          path: upload

      - name: Upload portable to IONOS via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: "./upload/*"
          # Login ist auf das Zielverzeichnis gechrootet -> "./" = Login-Home (im Client als /quotabar/ sichtbar)
          remote_path: "./"
          sftp_only: true
