    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";
        var ID = "01-limit-hit";
        var DURATION = 4.02;
        var BEAT = 0.3726;
        var F = 1 / 30;
        var $ = function (s) { return document.getElementById(ID + "-" + s); };

        var GREEN = "#52d017";
        var RED = "#ff4444";
        var CLAUDE = "#DA785B";

        // ---- beat-locked schedule ----
        var T_TYPE_START = 0.14;
        var T_TYPE_END = 0.93;
        var T_ENTER = 1.0;
        var T_L0 = BEAT * 3; // 1.118
        var T_L1 = BEAT * 4; // 1.490
        var T_L2 = BEAT * 4.5; // 1.677 - streams, cut off by the alarm
        var T_FREEZE = BEAT * 5; // 1.863 - alarm slam
        var T_AFTER1 = BEAT * 6; // 2.236
        var T_AFTER2 = BEAT * 7; // 2.608
        var T_SLAM = BEAT * 8; // 2.981 - "again?"
        var T_FLICK = BEAT * 10; // 3.726
        var STREAM_STEP = 0.026;
        var TYPING_GRACE = 0.12;
        var BLINK_CYCLES = 5; // whole number over DURATION (~0.8 s period)

        // ---- typed prompt: seeded human chunks (fixed LCG, deterministic) ----
        var CMD = "refactor the auth module and add tests";
        var seed = 20261020;
        function rnd() {
          seed = (seed * 16807) % 2147483647;
          return seed / 2147483647;
        }
        var chunks = [];
        var pos = 0;
        var wsum = 0;
        while (pos < CMD.length) {
          pos = Math.min(CMD.length, pos + 1 + Math.floor(rnd() * 3));
          var w = 0.6 + rnd() * 0.8 + (CMD.charAt(pos - 1) === " " ? 0.5 : 0);
          chunks.push({ len: pos, w: w });
          wsum += w;
        }
        var acc = 0;
        var SEQ = [{ t: 0, len: 0 }];
        for (var i = 0; i < chunks.length; i++) {
          SEQ.push({ t: T_TYPE_START + (acc / wsum) * (T_TYPE_END - T_TYPE_START), len: chunks[i].len });
          acc += chunks[i].w;
        }
        SEQ[SEQ.length - 1].t = Math.min(SEQ[SEQ.length - 1].t, T_TYPE_END);
        var CHANGE_TIMES = SEQ.slice(1).map(function (e) { return e.t; });
        function lenAt(t) {
          for (var k = SEQ.length - 1; k >= 0; k--) if (t >= SEQ[k].t) return SEQ[k].len;
          return 0;
        }

        var LINES = ["Reading src/auth/session.ts", "Editing 4 files…", "Writing tests…"];

        var cmdEl = $("cmd");
        var pCaret = $("pcaret");
        var tEls = [$("t0"), $("t1"), $("t2")];
        var bEls = [$("b0"), $("b1"), $("b2")];
        var cEls = [$("c0"), $("c1"), $("c2")];

        function render(t) {
          var blinkOn = Math.sin((Math.PI * 2 * BLINK_CYCLES * t) / DURATION) > 0;

          // prompt line + context-sensitive caret
          cmdEl.textContent = CMD.slice(0, lenAt(t));
          var typing = CHANGE_TIMES.some(function (ct) { return ct <= t && t - ct < TYPING_GRACE; });
          pCaret.style.display = t < T_ENTER ? "inline-block" : "none";
          pCaret.style.opacity = typing || blinkOn ? "1" : "0";

          // streamed output (frozen at the alarm)
          tEls[0].textContent = t >= T_L0 ? LINES[0] : "";
          tEls[1].textContent = t >= T_L1 ? LINES[1] : "";
          var st = Math.min(t, T_FREEZE);
          tEls[2].textContent = t >= T_L2 ? LINES[2].slice(0, Math.floor((st - T_L2) / STREAM_STEP) + 1) : "";
          bEls[0].style.opacity = t >= T_L0 ? "1" : "0";
          bEls[1].style.opacity = t >= T_L1 ? "1" : "0";
          bEls[2].style.opacity = t >= T_L2 ? "1" : "0";
          bEls[2].style.background = t >= T_FREEZE ? RED : CLAUDE;

          // stream caret rides the active line; turns alarm-red on the freeze
          var active = t < T_ENTER ? -1 : t < T_L0 ? 0 : t < T_L1 ? 1 : 2;
          var streaming = t >= T_L2 && t < T_FREEZE;
          for (var j = 0; j < 3; j++) {
            cEls[j].style.display = j === active ? "inline-block" : "none";
            cEls[j].style.background = t >= T_FREEZE ? RED : GREEN;
            cEls[j].style.opacity = streaming || blinkOn ? "1" : "0";
          }
        }
        render(0);

        var tl = gsap.timeline({ paused: true });

        // master driver (text states + carets), pure function of time
        var drv = { t: 0 };
        tl.to(drv, { t: DURATION, duration: DURATION, ease: "none", onUpdate: function () { render(drv.t); } }, 0);

        // ---- Scene 1: terminal in, one-time push-in settling by 1.5 s ----
        tl.fromTo($("term"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 0);
        tl.fromTo($("camera"), { scale: 0.93 }, { scale: 1, duration: 1.5, ease: "power3.out" }, 0);
        tl.fromTo($("lines"), { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
        tl.fromTo($("alarm"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

        // ---- Scene 2: alarm slam on beat 5 ----
        tl.set($("alarm"), { opacity: 1 }, T_FREEZE);
        tl.fromTo($("alarm"), { scaleX: 1.08, scaleY: 1.7, y: -8 }, { scaleX: 1, scaleY: 1, y: 0, duration: 0.2, ease: "expo.out" }, T_FREEZE);
        tl.to($("lines"), { opacity: 0.42, duration: 0.12, ease: "power2.out" }, T_FREEZE);

        // deterministic glitch tables (one entry per 30 fps frame)
        var SHAKE = [[-16, 7, -0.4], [13, -9, 0.3], [-7, 4, -0.15], [0, 0, 0]];
        var SPLIT = [10, -8, 5, 0];
        var ALARM_G = [[-12, 10], [9, -7], [-5, 4], [0, 0]];
        var shakeEl = $("shake");
        var termEl = $("term");
        var alarmTxt = $("alarm-text");
        SHAKE.forEach(function (s, k) {
          tl.set(shakeEl, { x: s[0], y: s[1], rotation: s[2] }, T_FREEZE + k * F);
        });
        SPLIT.forEach(function (d, k) {
          var f = d === 0 ? "drop-shadow(0px 0px 0px rgba(34,211,238,0)) drop-shadow(0px 0px 0px rgba(255,68,68,0))"
            : "drop-shadow(" + d + "px 0px 0px rgba(34,211,238,0.55)) drop-shadow(" + -d + "px 0px 0px rgba(255,68,68,0.6))";
          tl.set(termEl, { filter: f }, T_FREEZE + k * F);
        });
        function glitch(el, table, at, a, b) {
          table.forEach(function (g, k) {
            var v = {};
            v[a] = g[0] + "px";
            v[b] = g[1] + "px";
            v["--go"] = g[0] || g[1] ? 1 : 0;
            tl.set(el, v, at + k * F);
          });
        }
        glitch(alarmTxt, ALARM_G, T_FREEZE, "--gr", "--gc");
        glitch(alarmTxt, [[-5, 4], [3, -2], [0, 0]], T_AFTER1, "--gr", "--gc");
        glitch(alarmTxt, [[6, -5], [0, 0]], T_AFTER2, "--gr", "--gc");
        tl.set(shakeEl, { x: 3, y: -1 }, T_AFTER1);
        tl.set(shakeEl, { x: 0, y: 0 }, T_AFTER1 + 2 * F);

        // red vignette pulses once at the frame edges, decays to a low ember
        tl.fromTo($("vignette"), { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "power2.out" }, T_FREEZE);
        tl.to($("vignette"), { opacity: 0.22, duration: 0.9, ease: "power3.out" }, T_FREEZE + 0.07);

        // ---- Scene 3: depth-of-field pull + "again?" beat-slam on beat 8 ----
        tl.to($("dof"), { "--dof": "7px", opacity: 0.35, duration: 0.5, ease: "power2.inOut" }, T_SLAM);
        var againEl = $("again");
        tl.fromTo(againEl,
          { scale: 1.5, opacity: 0, filter: "blur(16px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
          T_SLAM);
        glitch(againEl, [[-10, 8], [6, -5], [0, 0]], T_FLICK, "--ar", "--ac");

        // hold with a tiny deterministic jitter
        var JIT = [[1, -1], [-1, 1], [2, 0], [-1, -1], [0, 1], [1, 0], [-2, 1], [1, -1], [0, 0], [-1, 0]];
        var jitEl = $("again-jit");
        JIT.forEach(function (j, k) {
          tl.set(jitEl, { x: j[0], y: j[1] }, 3.4 + k * 2 * F);
        });

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
