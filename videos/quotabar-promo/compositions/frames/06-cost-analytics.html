  <script>
    (function () {
      var FID = "06-cost-analytics";
      var $ = function (s) { return document.getElementById(FID + "-" + s); };
      var B = 0.3726; // one beat of the 161 bpm bed
      var SVGNS = "http://www.w3.org/2000/svg";

      // ---- deterministic hand-authored 30-day series (16 May → 14 Jun) ----
      var CLAUDE = [12, 26, 8, 31, 19, 4, 22, 38, 15, 29, 6, 34, 47, 62, 28, 104, 41, 17, 3, 36, 71, 24, 115, 49, 14, 33, 88, 27, 19, 56];
      var CODEX  = [4, 9, 15, 6, 12, 21, 3, 0, 18, 26, 11, 7, 14, 31, 10, 19, 36, 8, 2, 16, 23, 9, 38, 17, 5, 22, 29, 13, 6, 24];
      var W = 912, H = 326, YMAX = 120;
      var step = W / (CLAUDE.length - 1);

      function geom(series) {
        var xs = [], ys = [], cum = [0], d = "";
        for (var i = 0; i < series.length; i++) {
          var x = +(i * step).toFixed(2);
          var y = +(H - (series[i] / YMAX) * H).toFixed(2);
          xs.push(x); ys.push(y);
          d += (i === 0 ? "M" : " L") + x + " " + y;
          if (i > 0) {
            var dx = x - xs[i - 1], dy = y - ys[i - 1];
            cum.push(cum[i - 1] + Math.sqrt(dx * dx + dy * dy));
          }
        }
        return { xs: xs, ys: ys, cum: cum, total: cum[cum.length - 1], line: d, area: d + " L" + W + " " + H + " L0 " + H + " Z" };
      }

      function setupLine(prefix, g) {
        var line = $(prefix + "-line");
        line.setAttribute("d", g.line);
        $(prefix + "-area").setAttribute("d", g.area);
        var measured = line.getTotalLength ? line.getTotalLength() : 0;
        var len = measured > 0 ? measured : g.total;
        var pad = 12; // keeps the round cap fully hidden before the draw
        line.style.strokeDasharray = len + " " + (len + pad * 2);
        line.style.strokeDashoffset = String(len + pad);
        return { line: line, clip: $("clip-" + prefix + "-r"), len: len, pad: pad, g: g };
      }

      var gClaude = geom(CLAUDE);
      var gCodex = geom(CODEX);
      var claude = setupLine("claude", gClaude);
      var codex = setupLine("codex", gCodex);

      // Claude dot markers (built once, synchronously)
      var dotsG = $("claude-dots");
      var dots = [];
      for (var i = 0; i < gClaude.xs.length; i++) {
        var c = document.createElementNS(SVGNS, "circle");
        c.setAttribute("cx", gClaude.xs[i]);
        c.setAttribute("cy", gClaude.ys[i]);
        c.setAttribute("r", "0");
        c.setAttribute("fill", "#DA785B");
        c.setAttribute("stroke", "#0f1319");
        c.setAttribute("stroke-width", "2");
        dotsG.appendChild(c);
        dots.push(c);
      }

      var tl = gsap.timeline({ paused: true });

      // ===== Scene 1 (0.00–1.49): headline word-by-word + tile row + tile 1 count =====
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, 0);
      tl.fromTo($("kicker"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.06);
      ["w1", "w2", "w3", "w4"].forEach(function (id, k) {
        tl.fromTo($(id),
          { opacity: 0, y: 54, filter: "blur(10px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" },
          k * B + 0.02);
      });

      // one-time gentle push-in on the UI, settles by ~1.6s then holds
      tl.fromTo($("right"), { scale: 0.955 }, { scale: 1, duration: 1.6, ease: "power3.out" }, 0);

      tl.fromTo($("t1"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.04);
      tl.fromTo($("t2"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.12);
      // tile 2 value waits dimmed until its beat
      tl.fromTo($("v2"), { opacity: 0.28 }, { opacity: 0.28, duration: 0.01 }, 0);
      tl.fromTo($("x2"), { opacity: 0, y: 20 }, { opacity: 0, y: 20, duration: 0.01 }, 0);
      tl.fromTo($("glow"), { opacity: 0, scale: 0.8 }, { opacity: 0, scale: 0.8, duration: 0.01 }, 0);
      tl.fromTo($("t2-inner"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
      tl.fromTo($("t2-ring"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      // tile 1: $0 → $594, value + scale share timing and ease (counting-dynamic-scale)
      var n1 = $("n1"), s1 = { v: 0 };
      var C1_AT = 0.2, C1_DUR = 4 * B - 0.2; // lands on beat 4
      tl.fromTo(s1, { v: 0 }, { v: 594, duration: C1_DUR, ease: "power3.out",
        onUpdate: function () { n1.textContent = String(Math.round(s1.v)); } }, C1_AT);
      tl.fromTo(n1, { scale: 0.55 }, { scale: 1, duration: C1_DUR, ease: "power3.out" }, C1_AT);

      // ===== Scene 2 (beat 4): SUB ROI 0.0× → 21.2× (hero) + green bloom; beat 6 chip =====
      var n2 = $("n2"), s2 = { v: 0 };
      var C2_AT = 4 * B, C2_DUR = 1.3;
      tl.to($("v2"), { opacity: 1, duration: 0.25, ease: "power2.out" }, C2_AT);
      tl.fromTo(s2, { v: 0 }, { v: 21.2, duration: C2_DUR, ease: "power3.out",
        onUpdate: function () { n2.textContent = (Math.round(s2.v * 10) / 10).toFixed(1); } }, C2_AT);
      tl.fromTo(n2, { scale: 0.5 }, { scale: 1, duration: C2_DUR, ease: "power3.out" }, C2_AT);
      var LAND = C2_AT + C2_DUR;
      tl.to($("x2"), { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, LAND - 0.08);
      // ambient glow bloom — fades up once on landing, then holds
      tl.to($("glow"), { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" }, LAND - 0.15);
      tl.to($("t2-inner"), { opacity: 1, duration: 0.7, ease: "power2.out" }, LAND - 0.15);
      tl.to($("t2-ring"), { opacity: 1, duration: 0.5, ease: "power2.out" }, LAND - 0.1);

      // chip: CACHE HIT 97.3% pops beside it on beat 6
      var n3 = $("n3"), s3 = { v: 0 };
      var CH_AT = 6 * B;
      tl.fromTo($("chip"), { opacity: 0, scale: 0.86, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "power3.out" }, CH_AT);
      tl.fromTo(s3, { v: 0 }, { v: 97.3, duration: 0.9, ease: "power3.out",
        onUpdate: function () { n3.textContent = (Math.round(s3.v * 10) / 10).toFixed(1); } }, CH_AT + 0.05);

      // ===== Scene 3 (beat 8): chart card, Claude draw, annotation, Codex draw on beat 11 =====
      var CARD_AT = 8 * B;
      tl.fromTo($("chart"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, CARD_AT);
      tl.fromTo($("leg-codex"), { opacity: 0.32 }, { opacity: 0.32, duration: 0.01 }, 0);
      tl.fromTo($("annot-line"), { scaleY: 0, opacity: 0 }, { scaleY: 0, opacity: 0, duration: 0.01 }, 0);
      tl.fromTo($("annot-tag"), { opacity: 0, x: 10 }, { opacity: 0, x: 10, duration: 0.01 }, 0);

      // inverse of GSAP power2.out (1 - (1 - p)^3): when the pen reaches length fraction f
      function penTime(o, f, at, dur) {
        var fl = Math.min(1, (f * o.len + o.pad) / (o.len + o.pad));
        return at + dur * (1 - Math.cbrt(1 - fl));
      }
      // svg-path-draw: dashoffset (len + pad) → 0 on the measured length.
      // The area fill's clip edge follows the pen tip vertex-by-vertex (callback-free, seek-safe).
      function drawLine(o, at, dur) {
        tl.fromTo(o.line, { strokeDashoffset: o.len + o.pad }, { strokeDashoffset: 0, duration: dur, ease: "power2.out" }, at);
        var g = o.g, prevT = penTime(o, 0, at, dur);
        for (var k = 1; k < g.xs.length; k++) {
          var tk = penTime(o, g.cum[k] / g.total, at, dur);
          tl.fromTo(o.clip,
            { attr: { width: g.xs[k - 1] } },
            { attr: { width: k === g.xs.length - 1 ? W + 4 : g.xs[k] }, duration: Math.max(0.001, tk - prevT), ease: "none", immediateRender: false },
            prevT);
          prevT = tk;
        }
      }

      var CL_AT = CARD_AT + 0.12, CL_DUR = 1.7;
      drawLine(claude, CL_AT, CL_DUR);
      dots.forEach(function (dot, k) {
        var t = penTime(claude, gClaude.cum[k] / gClaude.total, CL_AT, CL_DUR);
        tl.fromTo(dot, { attr: { r: 0 } }, { attr: { r: 4 }, duration: 0.22, ease: "power2.out" }, t);
      });

      // dashed "Pro → Max 5×" annotation at ~41% x on beat 10 (pen has passed it)
      var AN_AT = 10 * B;
      tl.to($("annot-line"), { scaleY: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, AN_AT);
      tl.to($("annot-tag"), { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, AN_AT + 0.1);

      // Codex indigo line draws under it on beat 11
      var CX_AT = 11 * B, CX_DUR = 1.2;
      tl.to($("leg-codex"), { opacity: 1, duration: 0.3, ease: "power2.out" }, CX_AT);
      drawLine(codex, CX_AT, CX_DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
</template>
