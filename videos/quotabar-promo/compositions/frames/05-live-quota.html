      var JIT = [1, 0.86, 0.97, 0.9, 1];
      for (var j = 1; j < JIT.length; j++) {
        tl.fromTo($("glow"), { opacity: JIT[j - 1] }, { opacity: JIT[j], duration: 0.12, ease: "none", immediateRender: false }, 14.6 * B + (j - 1) * 0.12);
      }

      /* ---------- one deterministic driver: countdowns, segment steps, typing, caret ---------- */
      var c5 = $("5h-count"), cWk = $("wk-count");
      var fcText = $("fc-text"), caret = $("caret");
      var segs = Array.prototype.slice.call($("segs").children);

      var BASE_5H = 3 * 3600 + 4 * 60 + 46;        // 03:04:46 at frame start
      var BASE_WK = 15 * 3600 + 14 * 60 + 47 + 3;  // reads 15:14:47 when the row lands (t ~ 2.98)
      var PHASE = 0.4;                              // seconds tick at t = 0.6, 1.6, 2.6 ...
      function pad(n) { return (n < 10 ? "0" : "") + n; }
      function fmt(s) {
        var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
        return pad(h) + ":" + pad(m) + ":" + pad(x);
      }

      // weekly window segments: 13 of 14 elapsed, one lit per half-beat; the newest stays bright
      var SEG_START = 8.5 * B, SEG_STEP = B / 2, SEG_LIT = 13;
      var C_TRACK = "rgba(255,255,255,0.06)", C_NOW = "#4a9ee0", C_SPENT = "#2a4a66";

      var FC = "At current pace: lasts until reset";
      var SEQ = [
        { t: 0, text: "" },
        { t: 12.5 * B + 0.0, text: "At" },
        { t: 12.5 * B + 0.12, text: "At current" },
        { t: 12.5 * B + 0.26, text: "At current pace:" },
        { t: 14 * B, text: "At current pace: lasts" },
        { t: 14 * B + 0.11, text: "At current pace: lasts until" },
        { t: 14 * B + 0.23, text: FC }
      ];
      function textAt(t) {
        for (var i = SEQ.length - 1; i >= 0; i--) { if (t >= SEQ[i].t) return SEQ[i].text; }
        return "";
      }

      var drv = { t: 0 };
      function render() {
        var t = drv.t;
        var k = Math.floor(t + PHASE);
        c5.textContent = fmt(BASE_5H - k);
        cWk.textContent = fmt(BASE_WK - k);

        for (var i = 0; i < segs.length; i++) {
          var ti = SEG_START + i * SEG_STEP;
          var el = segs[i];
          if (i >= SEG_LIT || t < ti) {
            el.style.backgroundColor = C_TRACK;
            el.style.transform = "scaleY(1)";
          } else {
            var newest = (i === SEG_LIT - 1) || t < ti + SEG_STEP;
            el.style.backgroundColor = newest ? C_NOW : C_SPENT;
            var p = Math.max(0, 1 - (t - ti) / 0.28);
            el.style.transform = "scaleY(" + (1 + 0.35 * p * p).toFixed(4) + ")";
          }
        }

        fcText.textContent = textAt(t);
        // caret: deterministic square-wave blink (~0.6s cycle)
        caret.style.opacity = Math.sin((t - 12.5 * B) * Math.PI * 2 / 0.6 + Math.PI / 2) > 0 ? "1" : "0";
      }
      tl.fromTo(drv, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: render }, 0);
      render();

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
</template>
