    <script>
      (function () {
        var BEAT = 0.3726;
        var DUR = 5.96;
        var $ = function (id) {

        var grid = $("10-lockup-grid");
        var outer = $("10-lockup-outer");
        var inner = $("10-lockup-inner");
        var core = $("10-lockup-core");
        var glow = $("10-lockup-glow");
        var slider = $("10-lockup-slider");
        var markbox = $("10-lockup-markbox");
        var tag = $("10-lockup-tag");
        var edgeTrack = $("10-lockup-edgetrack");
        var edge = $("10-lockup-edge");
        var pill = $("10-lockup-pill");
        var dot = $("10-lockup-dot");
        var url = $("10-lockup-url");
        var black = $("10-lockup-black");
        var root = document.querySelector('[data-composition-id="10-lockup"]');
        var chars = root ? root.querySelectorAll(".\\31 0-lockup-ch") : [];

        // svg-path-draw: measured outline length (fallback = exact diamond perimeter).
        var len = 45.255;
        try {
          var measured = outer.getTotalLength();
          if (measured && isFinite(measured)) len = measured * 1.02;
        } catch (e) {}

        var tl = gsap.timeline({ paused: true });

        // ── Scene 1 (0.00–1.49s): ground + grid, mark assembles from its three layers ──
        tl.fromTo(grid, { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, 0);

        // Outer diamond draws its outline, then fills.
        outer.style.strokeDasharray = String(len);
        tl.fromTo(outer, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.62, ease: "power2.out" }, 0.08);
        tl.fromTo(outer, { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.3, ease: "power1.out" }, 0.5);

        // Beat 2: dark inner diamond scales in from 0 (cuts the hole).
        tl.fromTo(
          inner,
          { scale: 0, transformOrigin: "50% 50%" },
          { scale: 1, duration: 0.5, ease: "expo.out" },
          2 * BEAT
        );

        // Beat 3: green core pops in; glow blooms once behind the mark.
        tl.fromTo(
          core,
          { scale: 0, transformOrigin: "50% 50%" },
          { scale: 1, duration: 0.4, ease: "expo.out" },
          3 * BEAT
        );
        tl.fromTo(glow, { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 3 * BEAT);
        tl.fromTo(glow, { opacity: 1 }, { opacity: 0.5, immediateRender: false, duration: 0.9, ease: "power2.out" }, 3 * BEAT + 0.42);

        // ── Scene 2 (beat 4 = 1.49s): mark slides left, wordmark reveals letter-by-letter ──
        // Slider spans the row: xPercent 50 puts the markbox's left edge on the row
        // center, markbox xPercent -50 centers it; both settle to 0 = final lockup slot.

        tl.fromTo(slider, { xPercent: 50 }, { xPercent: 0, duration: 0.85, ease: "power3.out" }, SLIDE_AT);
        tl.fromTo(
          markbox,
          { xPercent: -50, scale: 1, transformOrigin: "0% 50%" },
          { xPercent: 0, scale: 0.8, duration: 0.85, ease: "power3.out" },
          SLIDE_AT
        );

        // Letter windows pre-computed once (dynamic-content-sequencing): equal per-letter
        // cadence, sequence starting as the mark clears the first letter.
        var LETTER_START = 1.8;
        var LETTER_GAP = 0.075;
        var LETTER_DUR = 0.55;
        var letterTimes = [];
        for (var i = 0; i < chars.length; i++) letterTimes.push(LETTER_START + i * LETTER_GAP);
        for (var j = 0; j < chars.length; j++) {
          tl.fromTo(
            chars[j],
            { yPercent: 150, opacity: 0 },
            { yPercent: 0, opacity: 1, duration: LETTER_DUR, ease: "expo.out" },
            letterTimes[j]
          );
        }

        // ── Scene 3 (beat 8 = 2.98s): tagline wipes in left→right with a green leading edge ──
        var WIPE_AT = 8 * BEAT;
        var WIPE_DUR = 0.75;
        tl.fromTo(

        tl.fromTo(edgeTrack, { xPercent: 0 }, { xPercent: 100, duration: WIPE_DUR, ease: "power2.inOut" }, WIPE_AT);

        tl.fromTo(url, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, CTA_AT + 0.12);

        // ── Scene 4 (4.47–5.96s): hold still, then fade everything to black (final exit) ──
        tl.fromTo(black, { opacity: 0 }, { opacity: 1, duration: DUR - 5.2, ease: "power1.inOut" }, 5.2);
