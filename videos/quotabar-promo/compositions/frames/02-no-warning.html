<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Syne";
      src: url("assets/fonts/archivo-expanded-latin-800-normal.woff2") /* headline weight 800 renders Archivo Expanded: Syne g/y descenders read as clipped at display size */ format("woff2");
      font-weight: 800;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      color: #e6eff6;
    }

    /* Full-bleed ground: ink-black + faint 1px hairline grid (~4% white) */
    [id="02-no-warning-bg"] {
      position: absolute;
      inset: 0;
      background-color: #07090d;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 5cqw 5cqw;
      background-position: 5.5cqw 5.5cqw;
    }

    /* Mono kicker, top-left, muted, whole frame */
    [id="02-no-warning-kicker"] {
      position: absolute;
      left: 5.5cqw;
      top: 5.5cqw;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      font-size: 0.8cqw;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #8298aa;
      white-space: nowrap;
    }

    /* Each pain line occupies the same left-anchored slot, vertically centred in the top ~85% */
    [class~="02-no-warning-line"] {
      position: absolute;
      left: 5.5cqw;
      right: 5.5cqw;
      top: 0;
      height: 920px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      font-family: "Syne", sans-serif;
      font-weight: 800;
      text-transform: lowercase;
      color: #e6eff6;
      white-space: nowrap;
    }

    [id="02-no-warning-l1"] {
      font-size: 11cqw;
      line-height: 0.88;
      letter-spacing: -0.04em;
    }

    [id="02-no-warning-l2"],
    [id="02-no-warning-l3"] {
      font-size: 6.3cqw;
      line-height: 0.95;
      letter-spacing: -0.03em;
      visibility: hidden;
    }

    [class~="02-no-warning-row"] {
      display: block;
    }

    [id="02-no-warning-close"] {
      position: relative;
      display: inline-block;
    }

    [id="02-no-warning-ul"] {
      position: absolute;
      left: 0.02em;
      right: 0.04em;
      bottom: -0.06em;
      height: 6px;
      background: #ff4444;
    }

    [id="02-no-warning-cost"] {
      color: #e6eff6;
    }
  </style>

  <div data-hf-id="hf-6veg" id="root" data-composition-id="02-no-warning" data-start="0" data-duration="3.23" data-width="1920" data-height="1080">
    <div data-hf-id="hf-2vt1" id="02-no-warning-bg" class="clip" data-start="0" data-duration="3.23" data-track-index="0"></div>

    <div data-hf-id="hf-8bot" id="02-no-warning-kicker">Claude Code · Codex</div>

    <!-- Beat 0: slam -->
    <div data-hf-id="hf-be8x" id="02-no-warning-l1" class="02-no-warning-line">
      <span data-hf-id="hf-qhkw" class="02-no-warning-row">no warning.</span>
    </div>

    <!-- Beat 2: hard cut -->
    <div data-hf-id="hf-fccy" id="02-no-warning-l2" class="02-no-warning-line">
      <span data-hf-id="hf-p603" class="02-no-warning-row">no idea how
        <span data-hf-id="hf-uc0s" id="02-no-warning-close">close<span data-hf-id="hf-q59b" id="02-no-warning-ul"></span></span></span>
      <span data-hf-id="hf-xk05" class="02-no-warning-row">you were.</span>
    </div>

    <!-- Beat 5: hard cut; "cost" turns red on beat 6 -->
    <div data-hf-id="hf-jagz" id="02-no-warning-l3" class="02-no-warning-line">
      <span data-hf-id="hf-nr71" class="02-no-warning-row">no idea</span>
      <span data-hf-id="hf-0qee" class="02-no-warning-row">what it <span data-hf-id="hf-4h3m" id="02-no-warning-cost">cost</span>.</span>
    </div>
  </div>

  <script>
    (function () {
      const FRAME_ID = "02-no-warning";
      const DUR = 2.98;
      const BEAT = 0.3726; // 161 bpm grid
      const CREAM = "#e6eff6";
      const RED = "#ff4444";

      const $ = (id) => document.getElementById(FRAME_ID + "-" + id);
      const kicker = $("kicker");
      const l1 = $("l1");
      const l2 = $("l2");
      const l3 = $("l3");
      const ul = $("ul");
      const cost = $("cost");

      // discrete-text-sequence: whole-line states swapped at beat thresholds (instant, no tween)
      const SEQUENCE = [
        { t: 0, el: l1 },
        { t: BEAT * 2, el: l2 },
        { t: BEAT * 5, el: l3 },
      ];
      const T_RED = BEAT * 6;

      // Deterministic hard-cut jitter (fixed table, 1/30s steps) on each cut + the colour swap
      const JITTER_ONSETS = [BEAT * 2, BEAT * 5, T_RED];
      const JITTER = [
        [9, -2],
        [-6, 1],
        [3, 0],
        [-1, 0],
      ];
      const STEP = 1 / 30;

      function stateAt(t) {
        for (let i = SEQUENCE.length - 1; i >= 0; i--) {
          if (t >= SEQUENCE[i].t) return SEQUENCE[i].el;
        }
        return SEQUENCE[0].el;
      }

      function jitterAt(t) {
        for (let i = JITTER_ONSETS.length - 1; i >= 0; i--) {
          if (t >= JITTER_ONSETS[i]) {
            const idx = Math.floor((t - JITTER_ONSETS[i]) / STEP);
            return idx < JITTER.length ? JITTER[idx] : [0, 0];
          }
        }
        return [0, 0];
      }

      function render(t) {
        const active = stateAt(t);
        l1.style.visibility = active === l1 ? "visible" : "hidden";
        l2.style.visibility = active === l2 ? "visible" : "hidden";
        l3.style.visibility = active === l3 ? "visible" : "hidden";
        cost.style.color = t >= T_RED ? RED : CREAM;
        const j = jitterAt(t);
        const tr = "translate(" + j[0] + "px," + j[1] + "px)";
        l2.style.transform = tr;
        l3.style.transform = tr;
      }

      const tl = gsap.timeline({ paused: true });

      // Driver for the discrete state machine (seek-safe: recomputed from time every update)
      const driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            render(driver.t);
          },
        },
        0,
      );

      // Kicker present the whole frame
      tl.fromTo(
        kicker,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" },
        0,
      );

      // Scene 1 — kinetic-beat-slam: scale 1.15 -> 1, blur -> 0
      tl.fromTo(
        l1,
        { scale: 1.15, filter: "blur(16px)", opacity: 0, transformOrigin: "0% 50%" },
        {
          scale: 1,
          filter: "blur(0px)",
          opacity: 1,
          duration: 0.45,
          ease: "power4.out",
          transformOrigin: "0% 50%",
        },
        0,
      );

      // Scene 2 — red stroke under "close" grows left -> right on beat 3
      tl.fromTo(
        ul,
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: BEAT, ease: "expo.out", transformOrigin: "0% 50%" },
        BEAT * 3,
      );

      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["02-no-warning"] = tl;
    })();
  </script>
</template>
