  <script>
    (function () {
      var ID = "09-trust";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (sel, scope) {
        return (scope || root).querySelector(sel);
      };
      var byId = function (id) {
        return root.querySelector('[id="' + id + '"]');
      };
      var qa = function (sel, scope) {
        return Array.prototype.slice.call((scope || root).querySelectorAll(sel));
      };

      var BEAT = 0.3726;
      var DUR = 4.47;
      var tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.00–0.75s): kicker + lowercase h2, top-left ──────────────
      tl.fromTo(
        byId("09-trust-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        byId("09-trust-kicker"),
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" },
        0.04,
      );
      // words rise out of their masks on half-beats
      ["09-trust-w1", "09-trust-w2", "09-trust-w3"].forEach(function (id, i) {
        tl.fromTo(
          byId(id),
          { yPercent: 155 },
          { yPercent: 0, duration: 0.6, ease: "power3.out" },
          0.08 + i * (BEAT / 2),
        );
      });

      // ── Scene 2 (0.75–3.35s): cards assemble one per 2 beats from below ───
      var cards = [0, 1, 2, 3].map(function (i) {
        return byId("09-trust-card-" + i);
      });
      cards.forEach(function (card, i) {
        var t = (2 + 2 * i) * BEAT; // beats 2, 4, 6, 8

        tl.fromTo(
          card,
          { opacity: 0, y: 70 },
          { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
          t,
        );
        // top hairline self-draws left -> right
        tl.fromTo(
          q(".t09-line", card),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.7, ease: "power3.out" },
          t + 0.05,
        );
        // green accent stub
        tl.fromTo(
          q(".t09-stub", card),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.45, ease: "power3.out" },
          t + 0.18,
        );
        tl.fromTo(
          q(".t09-num", card),
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power1.out" },
          t + 0.2,
        );
        // icon draw-on (svg-path-draw): outline first, inner parts at ~75%
        var DRAW = 0.55;
        qa(".t09-icon > *", card).forEach(function (shape, k) {
          var d = k === 0 ? DRAW : DRAW * 0.7;
          tl.fromTo(
            shape,
            { strokeDashoffset: 1.05 },
            { strokeDashoffset: 0, duration: d, ease: "power2.out" },
            t + 0.12 + (k === 0 ? 0 : 0.75 * DRAW + (k - 1) * 0.75 * 0.7 * DRAW),
          );
        });
        tl.fromTo(
          q(".t09-title", card),
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          t + 0.14,
        );
        tl.fromTo(
          q(".t09-body", card),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          t + 0.26,
        );
      });

      // ── Scene 3 (beat 9 → end): one green sweep along the top hairlines ────
      // One virtual sweep travels the whole row at constant speed; each card's
      // clipped segment is timed from its x position so the pass reads as one
      // continuous highlight that only lights the hairlines (not the gaps).
      // Geometry in cqw: row 89, gap 2, card w 20.75, sweep 0.55 * w.
      var T0 = 9 * BEAT; // 3.353
      var ROW = 89;
      var GAP = 2;
      var W = (ROW - 3 * GAP) / 4;
      var SW = 0.55 * W;
      var PASS = 1.0;
      var V = (ROW + SW) / PASS;
      cards.forEach(function (card, i) {
        var L = i * (W + GAP);
        var ta = T0 + L / V;
        var tb = T0 + (L + W + SW) / V;
        tl.fromTo(
          q(".t09-sweep", card),
          { xPercent: -100 },
          { xPercent: (W / SW) * 100, duration: tb - ta, ease: "none" },
          ta,
        );
        // the stub answers as the highlight crosses it
        tl.fromTo(
          q(".t09-stub", card),
          { scaleX: 1 },
          { scaleX: 2.2, duration: 0.35, ease: "power3.out", immediateRender: false },
          ta,
        );
      });

      // pin the timeline length to the frame duration (hold to the end)
      tl.set({}, {}, DUR);

      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
