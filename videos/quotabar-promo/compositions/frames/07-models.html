  <script>
    (function () {
      var FID = "07-models";
      var $ = function (id) { return document.getElementById(FID + "-" + id); };
      var B = 0.3726; // one beat at 161 bpm
      var tl = gsap.timeline({ paused: true });

      // ---------- Scene 1 (0.00–1.12s): headline + card shell ----------
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo($("kicker-text"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.04);
      tl.fromTo($("l1"), { yPercent: 160 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0);
      tl.fromTo($("l2"), { yPercent: 160 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, B);
      tl.fromTo($("l3"), { yPercent: 160 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 2 * B);

      // card arrives + one-time gentle push-in over the first bar, then holds
      tl.fromTo($("card"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo($("card"), { scale: 0.965 }, { scale: 1, duration: 1.49, ease: "expo.out" }, 0);
      tl.fromTo($("title"), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, B);
      tl.fromTo([$("hdr-model"), $("hdr-cost"), $("hdr-pct"), $("hdr-split")],
        { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.05 }, 2 * B);
      tl.fromTo($("hdr-sep"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 2 * B);
      tl.fromTo($("vsep"), { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.out" }, 2 * B);
      tl.fromTo($("ring-track"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 2 * B);

      // ---------- Scene 2 (1.12–3.35s): rows cascade, one per 1.5 beats ----------
      var rows = [
        { cost: 231.39, pct: 39 },
        { cost: 104.05, pct: 18 },
        { cost: 101.27, pct: 17 },
        { cost: 5.70, pct: 1 }
      ];
      var COUNT_DUR = 1.0;
      rows.forEach(function (r, i) {
        var at = (3 + i * 1.5) * B;
        var costEl = $("c" + i);
        var pctEl = $("p" + i);

        tl.fromTo($("r" + i), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at);
        // share bar grows to its % as the row lands (shares the count's ease + duration)
        tl.fromTo($("f" + i), { scaleX: 0 }, { scaleX: r.pct / 100, duration: COUNT_DUR, ease: "power3.out" }, at);
        // cost + % count up; transform scale grows with the count (counting-dynamic-scale)
        // innerText tweens + formatting modifiers: no callbacks, so seeks render correctly
        tl.fromTo(costEl, { innerText: 0 }, {
          innerText: r.cost, duration: COUNT_DUR, ease: "power3.out",
          modifiers: { innerText: function (v) { return "$" + (+v).toFixed(2); } }
        }, at);
        tl.fromTo(pctEl, { innerText: 0 }, {
          innerText: r.pct, duration: COUNT_DUR, ease: "power3.out",
          modifiers: { innerText: function (v) { return Math.round(+v) + "%"; } }
        }, at);
        tl.fromTo([costEl, pctEl], { scale: 0.82 }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, at);
      });

      // ---------- Scene 3 (3.35–4.47s): donut sweeps closed + legend ----------
      var claudeRing = $("ring-claude");
      var codexRing = $("ring-codex");
      var LEN = claudeRing.getTotalLength();
      var GAP = LEN * (2 / 360);
      var claudeLen = LEN * 0.77 - GAP;
      var codexLen = LEN * 0.23 - GAP;
      claudeRing.style.strokeDasharray = claudeLen + " " + (LEN * 2); // long gap: no wrap-around sliver
      codexRing.style.strokeDasharray = codexLen + " " + (LEN * 2);

      var D0 = 9 * B; // beat 9
      var SEG1 = 0.6;
      tl.fromTo(claudeRing, { strokeDashoffset: claudeLen + 2 }, { strokeDashoffset: 0, duration: SEG1, ease: "power2.out" }, D0);
      tl.fromTo(codexRing, { strokeDashoffset: codexLen + 2 }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, D0 + SEG1 * 0.75);

      tl.fromTo($("leg-a"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 10 * B);
      tl.fromTo($("leg-sep"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 10 * B + 0.1);
      tl.fromTo($("leg-b"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" }, 11 * B);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
