  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const FID = "03-tray-intro";
      const DUR = 5.96;
      const B = 0.3726; // one beat at 161 bpm; "beat N" = N * B after frame start
      const root = document.querySelector('[data-composition-id="03-tray-intro"]');
      const $ = (id) => document.getElementById(FID + "-" + id);
      const $$ = (cls) => Array.from(root.querySelectorAll('[class~="' + FID + "-" + cls + '"]'));

      const tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.00–1.49s) — the DROP ─────────────────────────
      // Shockwave ring from the tray corner, landing on the downbeat.
      tl.fromTo($("ring"), { scale: 0.15 }, { scale: 6, duration: 1.3, ease: "expo.out" }, 0);
      tl.fromTo($("ring"), { opacity: 1 }, { opacity: 0, duration: 1.3, ease: "power2.in" }, 0);
      tl.fromTo($("bloom"), { opacity: 0.9, scale: 0.6 }, { opacity: 0, scale: 1.15, duration: 1.4, ease: "power2.out" }, 0);

      // Taskbar rises from the bottom edge.
      tl.fromTo($("taskbar"), { y: 72 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo($$("app"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out", stagger: 0.035 }, 0.12);
      tl.fromTo([$("chev"), $("sys"), $("clock")], { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out", stagger: 0.05 }, 0.2);

      // Beat 2 — the QuotaBar diamond pops into the tray (no overshoot).
      tl.fromTo($("icon"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 2 * B);
      tl.fromTo($("halo"), { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 2 * B);
      tl.to($("halo"), { opacity: 0.45, duration: 0.6, ease: "power2.out" }, 2 * B + 0.55);

      // Icon click: hover plate + press dip, released on beat 4.
      tl.fromTo($("hover"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out" }, 3.5 * B);
      tl.to($("icon"), { scale: 0.86, duration: 0.12, ease: "power2.in" }, 4 * B - 0.16);
      tl.to($("icon"), { scale: 1, duration: 0.35, ease: "power3.out" }, 4 * B);

      // ── Scene 2 (1.49–3.35s) — popup opens, bars fill ──────────
      // Origin = the tray icon (canvas x 1630 → popup-local 187px at 1x).
      tl.fromTo($("pop"),
        { scale: 0.6, opacity: 0, transformOrigin: "187px 100%" },
        { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 4 * B);
      tl.fromTo($("pophead"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 4 * B + 0.06);
      tl.fromTo([$("card-claude"), $("card-codex")], { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 4 * B + 0.1);

      // Paired stat: bar fill + count-up + dynamic scale share start, duration and ease.
      function stat(p, target, fillTo, at, dur) {
        const num = $("num-" + p);
        const state = { v: 0 };
        let last = -1;
        tl.fromTo(state, { v: 0 }, {
          v: target, duration: dur, ease: "power3.out",
          onUpdate: () => {
            const r = Math.round(state.v);
            if (r !== last) { num.textContent = String(r); last = r; }
          }
        }, at);
        tl.fromTo(num, { scale: 0.55 }, { scale: 1, duration: dur, ease: "power3.out" }, at);
        tl.fromTo($("fill-" + p), { scaleX: 0 }, { scaleX: fillTo, duration: dur, ease: "power3.out" }, at);
        // Suffix lands after the count.
        tl.fromTo($("suf-" + p), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, at + dur);
      }
      stat("claude", 68, 0.68, 6 * B, 1.1);  // beat 6
      stat("codex", 1, 0.01, 7 * B, 0.9);    // beat 7

      // Countdowns tick down second by second, derived from timeline time.
      const CD = [
        { el: $("cd-claude"), base: 3 * 3600 + 4 * 60 + 46 },
        { el: $("cd-codex"), base: 4 * 3600 + 58 * 60 + 4 }
      ];
      const pad = (n) => (n < 10 ? "0" : "") + n;
      const fmt = (s) => pad(Math.floor(s / 3600)) + ":" + pad(Math.floor((s % 3600) / 60)) + ":" + pad(s % 60);
      const clock = { t: 0 };
      let lastSec = -1;
      tl.fromTo(clock, { t: 0 }, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: () => {
          const s = Math.floor(clock.t + 1e-6);
          if (s !== lastSec) {
            CD.forEach((c) => { c.el.textContent = fmt(c.base - s); });
            lastSec = s;
          }
        }
      }, 0);

      // ── Scene 3 (3.35–5.96s) — Introducing / QUOTABAR ──────────
      tl.fromTo($("rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, 9 * B);
      tl.fromTo($("kicktext"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 9 * B + 0.05);

      // Beat 11 — mark, then the wordmark letter by letter.
      const WORD_AT = 11 * B;
      tl.fromTo($("bigmark"), { scale: 0.3, rotation: -45, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, WORD_AT);

      // Content-driven sequencing: per-letter start times computed once from the word.
      const SEC_PER_CHAR = 0.055;
      const LETTER_DUR = 0.42;
      const SEQ = $$("ch").map((el, i) => ({ el, start: WORD_AT + 0.06 + i * SEC_PER_CHAR }));
      SEQ.forEach((s) => {
        tl.fromTo(s.el,
          { opacity: 0, y: 40, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: LETTER_DUR, ease: "power3.out" }, s.start);
      });

      // Beat 13 — lead line (never before the last letter has started).
      const LEAD_AT = Math.max(13 * B, SEQ[SEQ.length - 1].start);
      tl.fromTo($("lead"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, LEAD_AT);

      // Hold — subtle jitter from a fixed table on beats 14 and 15.
      const JITTER = [[14 * B, 3], [15 * B, -2]];
      JITTER.forEach(([t, dx]) => {
        tl.fromTo($("wordrow"), { x: dx }, { x: 0, duration: 0.12, ease: "power2.out", immediateRender: false }, t);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
